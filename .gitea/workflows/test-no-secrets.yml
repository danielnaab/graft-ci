name: Test No Secrets

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Make scripts executable
        run: |
          chmod +x src/*.sh

      - name: List scripts
        run: |
          echo "Scripts in src/:"
          ls -la src/*.sh

      - name: Test complete
        run: |
          echo "Workflow ran successfully without secrets!"
