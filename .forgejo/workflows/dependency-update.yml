name: Dependency Update Automation

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [org_push]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream repository that was updated'
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Hello
        run: echo "Workflow triggered successfully"
