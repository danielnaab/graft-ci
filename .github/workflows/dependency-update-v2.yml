name: Dependency Update v2

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORGEJO_URL: http://platform-vm.local/git
  GRAFT_ORG: daniel
  CODER_URL: http://192.168.1.51:7080

jobs:
  dependency-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout graft-ci
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

          echo "Installed tools:"
          yq --version
          jq --version

      - name: Make scripts executable
        run: |
          chmod +x src/*.sh

      - name: Build dependency graph
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          echo "Building dependency graph..."
          ./src/graph-builder.sh > graph.json

          echo "Dependency graph (first 20 lines):"
          cat graph.json | jq . | head -20

      - name: Test complete
        run: |
          echo "✅ Dependency graph built successfully!"
          echo "Workflow is working - ready to add remaining steps"
